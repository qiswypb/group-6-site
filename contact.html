<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | GLAM.exe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">GLAM.exe ✦</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact-content">

            <h1>Get in Touch ✦</h1>

            <p>
                Have a question or want to share your thoughts?
                Send us a message using the form below.
            </p>

            <form id="contactForm">

                <label for="name">Your Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="message">Your Message</label>
                <textarea
                    id="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>

                <button type="submit">Send Message</button>

            </form>

            <div class="section">
                <h2>Other Ways to Reach Us</h2>
                <p>Email: hello@glamexe.example</p>
                <p>Instagram: @glam.exe</p>
            </div>

        </section>
    </main>

    <footer>
        <p>GLAM.exe ✦ | Group 6</p>
        <p>© 2026 GLAM.exe. All rights reserved.</p>
    </footer>

</body>
</html>
